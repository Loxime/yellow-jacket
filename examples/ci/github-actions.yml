name: Yellow Jacket

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Yellow Jacket coverage
        shell: bash
        run: |
          set +e

          npx yellow-jacket coverage --markdown \
            > yellow-jacket-coverage.md

          status=$?

          cat yellow-jacket-coverage.md \
            >> "$GITHUB_STEP_SUMMARY"

          cat yellow-jacket-coverage.md

          exit "$status"

      - name: Upload Yellow Jacket report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellow-jacket-coverage
          path: yellow-jacket-coverage.md
