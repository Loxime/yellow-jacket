name: Yellow Jacket Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yellow-jacket-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      coverage-status: ${{ steps.coverage.outputs.status }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Yellow Jacket report
        id: coverage
        shell: bash
        run: |
          set +e

          npx yellow-jacket coverage \
            --html \
            --output public/index.html

          status=$?

          echo "status=$status" >> "$GITHUB_OUTPUT"

          # The coverage gate is enforced after the Pages deployment,
          # so the failed report remains available for inspection.
          exit 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  coverage-gate:
    runs-on: ubuntu-latest

    if: always()

    needs:
      - build
      - deploy

    steps:
      - name: Enforce Yellow Jacket coverage
        env:
          COVERAGE_STATUS: ${{ needs.build.outputs.coverage-status }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          if [ "$DEPLOY_RESULT" != "success" ]; then
            echo "GitHub Pages deployment failed."
            exit 1
          fi

          exit "${COVERAGE_STATUS:-1}"
